name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pip install reportlab==4.4.9 pypdf==6.10.0 pdfplumber==0.11.9
      - run: make all
      - run: git diff --exit-code
